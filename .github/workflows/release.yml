name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - os: macos-latest
            platform: macos-arm64
            cmake_args: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - os: windows-latest
            platform: windows-x86_64
            cmake_args: ""

    steps:
    - uses: actions/checkout@v4

    - name: Install GLFW / NFD dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: |
          sudo apt update
          sudo apt install libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libgtk-3-dev

    - name: Install latest GCC
      if: matrix.os == 'ubuntu-24.04'
      run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt update
          latest=$(apt-cache search '^gcc-[0-9]+$' | grep -oE 'gcc-[0-9]+' | sort -V -t- -k2 | tail -1)
          ver=${latest#gcc-}
          sudo apt install -y "gcc-$ver" "g++-$ver"
          sudo ln -sf "/usr/bin/gcc-$ver" /usr/local/bin/gcc
          sudo ln -sf "/usr/bin/g++-$ver" /usr/local/bin/g++

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        ${{ matrix.cmake_args }}
        -DCMAKE_BUILD_TYPE=Release
        -DK2_BUILD_TESTS=OFF
        -DK2_BUILD_SANDBOX=OFF
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Stage binaries
      run: cmake --install ${{ github.workspace }}/build --config Release --prefix ${{ github.workspace }}/stage

    - name: Package (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
          cd "${{ github.workspace }}/stage"
          tar -czf "${{ github.workspace }}/kione2D-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" .

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
          Compress-Archive -Path "${{ github.workspace }}/stage/*" -DestinationPath "${{ github.workspace }}/kione2D-${{ github.ref_name }}-${{ matrix.platform }}.zip"

    - name: Publish to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ github.workspace }}/kione2D-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          ${{ github.workspace }}/kione2D-${{ github.ref_name }}-${{ matrix.platform }}.zip
        generate_release_notes: true
        fail_on_unmatched_files: false
